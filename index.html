<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#0B1D3A">

    <meta
        name="description"
        content="سوبر منيو — منيو رقمي تفاعلي فاخر وسهل الاستخدام"
    >

    <meta name="author" content="Marwan Maher">

    <title>Super Menu | سوبر منيو</title>

    <!-- ==================== FONTS ==================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Cairo:wght@400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- ==================== STYLES ==================== -->

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ==========================================================
         SPLASH / LOADER
         ========================================================== -->

    <div
        id="loader"
        class="loader"
        aria-label="Loading Super Menu"
    >
        <div class="loader-mark">
            <span>SM</span>
        </div>

        <div class="loader-badge">
            Super Menu
        </div>
    </div>


    <!-- ==========================================================
         RESTAURANT HEADER
         ========================================================== -->

    <header class="restaurant-header">

        <!-- VIDEO BACKGROUND -->

        <video
    class="header-video"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
>
    <source
        src="cff16910c489a861d03a5c0499a85780_720w.mp4"
        type="video/mp4"
    >
</video>


        <!-- HEADER TOP -->

        <div class="header-top">

            <!-- THEME BUTTON -->

            <button
                id="theme-toggle"
                class="icon-btn"
                type="button"
                aria-label="Toggle theme"
                title="Dark / Light"
            >

                <svg
                    class="icon icon-moon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>

                <svg
                    class="icon icon-sun"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2"/>
                    <path d="M12 20v2"/>
                    <path d="M4.93 4.93l1.41 1.41"/>
                    <path d="M17.66 17.66l1.41 1.41"/>
                    <path d="M2 12h2"/>
                    <path d="M20 12h2"/>
                    <path d="M4.93 19.07l1.41-1.41"/>
                    <path d="M17.66 6.34l1.41-1.41"/>
                </svg>

            </button>


            <!-- LANGUAGE BUTTON -->

            <button
                id="lang-toggle"
                class="lang-btn"
                type="button"
                aria-label="Change language"
            >
                <span class="lang-current">EN</span>
            </button>

        </div>


        <!-- HEADER CONTENT -->

        <div class="header-content">

            <!-- RESTAURANT LOGO -->

            <div class="logo##">
              
              <p>
              

                <img
                    id="lo-img"
                    class="restaurant-logo"
                    src=""
                    alt="Restaurant Logo"
                    loading="eager"
                    onerror="this.style.display='none'"
                >

            </div>


            <!-- RESTAURANT BRAND -->

            <span class="eyebrow">
            </span>


            <h1
                class="restaurant-name"
                data-i18n="restaurant_name"
            >
                سوبر منيو
            </h1>


            <p
                class="restaurant-tagline"
                data-i18n="restaurant_tagline"
            >
                أكل شهي، تجربة مختلفة
            </p>


            <!-- HEADER ACTIONS -->

            <div
                class="header-actions"
                aria-label="Restaurant actions"
            >

                <!-- CALL -->

                <a
                    href="tel:+201234567890"
                    class="action-pill"
                    aria-label="Call restaurant"
                    title="Call"
                >

                    <svg
                        class="icon"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
                    </svg>

                </a>


                <!-- WHATSAPP -->

                <a
                    href="https://wa.me/201234567890"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="action-pill"
                    aria-label="WhatsApp"
                    title="WhatsApp"
                >

                    <svg
                        class="icon"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M17.6 6.32A7.85 7.85 0 0 0 12.05 4a7.94 7.94 0 0 0-6.9 11.9L4 20l4.2-1.1a7.9 7.9 0 0 0 3.85 1h.02a7.94 7.94 0 0 0 5.53-13.58z"/>
                        <path d="M12.07 18.4a6.6 6.6 0 0 1-3.36-.92l-.24-.14-2.5.66.67-2.43-.16-.25a6.58 6.58 0 1 1 5.6 3.08zm3.6-4.93c-.2-.1-1.17-.58-1.35-.64s-.32-.1-.45.1-.5.64-.62.77-.23.15-.43.05a5.4 5.4 0 0 1-1.6-.99 6 6 0 0 1-1.1-1.37c-.12-.2 0-.3.09-.4.1-.1.2-.23.3-.35.1-.12.13-.2.2-.33a.37.37 0 0 0 0-.35c0-.1-.45-1.08-.62-1.48-.16-.4-.33-.33-.45-.34h-.38a.74.74 0 0 0-.53.25 2.24 2.24 0 0 0-.7 1.67 3.9 3.9 0 0 0 .82 2.06 8.9 8.9 0 0 0 3.4 3c.48.2.85.33 1.14.42.48.15.92.13 1.26.08.39-.06 1.17-.48 1.33-.94.17-.46.17-.85.12-.94-.05-.09-.18-.14-.38-.24z"/>
                    </svg>

                </a>


                <!-- INSTAGRAM -->

                <a
                    href="https://instagram.com"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="action-pill"
                    aria-label="Instagram"
                    title="Instagram"
                >

                    <svg
                        class="icon"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <rect
                            x="2"
                            y="2"
                            width="20"
                            height="20"
                            rx="5"
                        />

                        <circle
                            cx="12"
                            cy="12"
                            r="4"
                        />

                        <circle
                            cx="17.5"
                            cy="6.5"
                            r="1"
                        />

                    </svg>

                </a>


                <!-- LOCATION -->

                <a
                    href="https://maps.google.com"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="action-pill"
                    aria-label="Restaurant location"
                    title="Location"
                >

                    <svg
                        class="icon"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                        <circle
                            cx="12"
                            cy="10"
                            r="3"
                        />
                    </svg>

                </a>

            </div>

        </div>

    </header>


    <!-- ==========================================================
         SEARCH
         ========================================================== -->

    <section
        class="search-wrap"
        aria-label="Menu search"
    >

        <div class="search-box">

            <svg
                class="icon search-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <circle
                    cx="11"
                    cy="11"
                    r="8"
                />

                <path d="M21 21l-4.35-4.35"/>
            </svg>


            <input
                type="search"
                id="search-input"
                data-i18n-placeholder="search_placeholder"
                placeholder="ابحث عن صنف..."
                autocomplete="off"
                aria-label="Search menu"
            >


            <button
                id="clear-search"
                class="clear-btn"
                type="button"
                aria-label="Clear search"
            >

                <svg
                    class="icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path d="M18 6L6 18"/>
                    <path d="M6 6l12 12"/>
                </svg>

            </button>

        </div>


        <!-- FAVORITES FILTER -->

        <button
            id="fav-filter-btn"
            class="fav-filter-btn"
            type="button"
            aria-label="Show favorites"
            title="Favorites"
        >

            <svg
                class="icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>

        </button>

    </section>


    <!-- ==========================================================
         CATEGORY NAVIGATION
         ========================================================== -->

    <nav
        class="categories"
        id="categories"
        aria-label="Menu categories"
    >
        <!-- Categories injected by JavaScript -->
    </nav>


    <!-- ==========================================================
         MAIN MENU
         ========================================================== -->

    <main>

        <section
            class="menu-section"
            aria-label="Restaurant menu"
        >

            <div id="menu-container"></div>


            <!-- EMPTY SEARCH STATE -->

            <div
                id="empty-state"
                class="empty-state hidden"
                role="status"
                aria-live="polite"
            >

                <svg
                    class="icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <circle
                        cx="11"
                        cy="11"
                        r="8"
                    />

                    <path d="M21 21l-4.35-4.35"/>
                </svg>


                <p data-i18n="no_results">
                    مفيش نتائج مطابقة لبحثك
                </p>

            </div>

        </section>

    </main>


    <!-- ==========================================================
         PRODUCT MODAL
         ========================================================== -->

    <div
        id="product-modal"
        class="modal-overlay hidden"
        aria-hidden="true"
    >

        <div
            class="modal-sheet"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modal-name"
        >

            <div class="modal-drag">
                <span></span>
            </div>


            <!-- CLOSE -->

            <button
                id="modal-close"
                class="modal-close"
                type="button"
                aria-label="Close"
            >

                <svg
                    class="icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path d="M18 6L6 18"/>
                    <path d="M6 6l12 12"/>
                </svg>

            </button>


            <!-- PRODUCT IMAGE -->

            <div class="modal-img-wrap">

                <img
                    id="modal-img"
                    src=""
                    alt=""
                    loading="lazy"
                >

                <span
                    id="modal-tag"
                    class="menu-tag hidden"
                ></span>

            </div>


            <!-- PRODUCT INFORMATION -->

            <div class="modal-body">

                <div class="modal-title-row">

                    <h2 id="modal-name"></h2>


                    <button
                        id="modal-fav"
                        class="fav-btn"
                        type="button"
                        aria-label="Add to favorites"
                    >

                        <svg
                            class="icon"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                        </svg>

                    </button>

                </div>


                <p
                    id="modal-desc"
                    class="modal-desc"
                ></p>


                <div class="modal-footer">

                    <strong
                        id="modal-price"
                        class="modal-price"
                    ></strong>

                    <span
                        id="modal-order-hint"
                        class="modal-cta"
                    ></span>

                </div>

            </div>

        </div>

    </div>


    <!-- ==========================================================
         SCROLL TO TOP
         ========================================================== -->

    <button
        id="scroll-top-btn"
        class="scroll-top-btn"
        type="button"
        aria-label="Scroll to top"
        title="Back to top"
    >

        <svg
            class="icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
        >
            <path d="M18 15l-6-6-6 6"/>
        </svg>

    </button>


    <!-- ==========================================================
         TOAST
         ========================================================== -->

    <div
        id="toast"
        class="toast"
        role="status"
        aria-live="polite"
    ></div>


    <!-- ==========================================================
         FOOTER
         ========================================================== -->

    <footer class="site-footer">

        <div class="footer-divider"></div>

        <p data-i18n="footer_made">
            قم بإنشاء قائمة طعام مثل هذه لمطعمك
        </p>

        <p data-i18n="maroo">
            من تطوير مروان ماهر
        </p>

    </footer>


    <!-- ==========================================================
         JAVASCRIPT
         ========================================================== -->

    <script src="data.js"></script>
    <script src="script.js"></script>

</body>
</html>
